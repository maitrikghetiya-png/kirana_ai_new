AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KiranaAI - Serverless AI Agent for Indian Kirana Udhaar Bookkeeping (Bedrock + Strands Agents + DynamoDB + Lambda)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11

Resources:
  # DynamoDB Table for Customer Udhaar Khata
  KiranaUdhaarTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: KiranaAI_Udhaar
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # FastAPI / Mangum ASGI Serverless Function
  KiranaAIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref KiranaUdhaarTable
          BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
      Policies:
        # Full access to the DynamoDB table
        - DynamoDBCrudPolicy:
            TableName: !Ref KiranaUdhaarTable
        # IAM policy allowing invocation of Amazon Bedrock models
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        ApiEvent:
          Type: HttpApi
        DailyAutonomousReminder:
          Type: Schedule
          Properties:
            Schedule: "rate(1 day)"
            Description: "Autonomous EventBridge trigger for kirana customer udhaar reminders"
            Enabled: True


Outputs:
  KiranaAIApiEndpoint:
    Description: "HTTP API endpoint URL for KiranaAI"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
